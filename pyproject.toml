[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-coach"
version = "0.1.0"
description = "Global-hotkey prompt rewriter using a local LLM (Windows)"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8.1",
    "PySide6>=6.7",
    "pywin32>=306",
    "uiautomation>=2.0.29",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5"]
gemini = ["google-genai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live-model tests are opt-in:  pytest -m ollama tests/test_golden.py -s
addopts = "-m 'not ollama'"
pythonpath = ["src"]
markers = [
    "windows: needs a real Windows clipboard/desktop",
    "ollama: needs a running local Ollama with the model pulled",
]
